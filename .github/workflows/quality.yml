name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Embedded PostgreSQL authorization and transaction tests
        run: npm run test:db
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Production build
        run: npm run build

      - name: Verify the committed build output is current
        run: |
          npm run check:build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error title=Stale build output::dist/ in the repository does not match a fresh build. Run npm run publish:build and commit the result."
            git status --porcelain dist
            exit 1
          fi
      - name: Install Chromium for browser gate
        run: npx playwright install --with-deps chromium
      - name: Playwright UI and accessibility gate
        run: npm run test:e2e
